<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>말랑 산장 살인사건</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#3b2f2a; --paper:#fbf3e4; --paper2:#f3e6cc; --red:#b5352d; --navy:#2d3557;
    --pink:#ffb7c5; --mint:#b8e8c8; --sky:#b9d8ff; --lemon:#ffe58a; --lav:#d9c8ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#232742;color:var(--ink);font-family:'Gowun Dodum',sans-serif}
  canvas#world{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
  .jua{font-family:'Jua',sans-serif}
  button{font-family:'Jua',sans-serif;border:none;border-radius:16px;padding:12px 16px;font-size:16px;color:var(--ink);background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer}
  button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  button.primary{background:var(--red);color:#fff}
  button.navy{background:var(--navy);color:#fff}
  button:disabled{opacity:.45}
  input{font-family:'Jua',sans-serif;font-size:18px;padding:12px 14px;border-radius:14px;border:3px solid var(--ink);background:#fff;width:100%;color:var(--ink)}
  .hidden{display:none !important}

  /* overlays */
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(25,22,40,.55);z-index:20}
  .card{background:var(--paper);border-radius:22px;padding:20px;width:min(440px,100%);max-height:calc(100% - 24px);overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.25);position:relative}
  .dossier{background:
      radial-gradient(circle at 1px 1px, rgba(60,40,20,.09) 1px, transparent 1.4px) 0 0/6px 6px,
      var(--paper);
    border:2px solid #e2cfa9}
  .title{font-family:'Jua';font-size:30px;line-height:1.15;margin:0 0 4px}
  .sub{color:#5a4a40;margin:0 0 14px;font-size:14px}
  .row{display:flex;gap:8px;align-items:center}
  .stack{display:flex;flex-direction:column;gap:10px}
  .stamp{position:absolute;right:64px;top:16px;border:3px solid var(--red);color:var(--red);font-family:'Jua';padding:2px 8px;border-radius:8px;transform:rotate(8deg);font-size:14px;opacity:.85}
  .tag{display:inline-block;font-family:'Jua';font-size:12px;padding:2px 8px;border-radius:999px;background:var(--paper2);margin-right:4px}
  .err{color:var(--red);font-size:14px;min-height:18px}
  h3{font-family:'Jua';font-weight:400;margin:14px 0 6px;font-size:18px}
  p{margin:6px 0;line-height:1.5}
  .secret{background:#2d3557;color:#fff7e8;border-radius:14px;padding:12px}
  .secret h3{color:var(--lemon);margin-top:0}

  /* HUD */
  #hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:10;pointer-events:none}
  #hud > *{pointer-events:auto}
  .pill{background:rgba(251,243,228,.95);border-radius:999px;padding:8px 14px;font-family:'Jua';box-shadow:0 3px 0 rgba(0,0,0,.2);font-size:15px}
  #phasePill b{color:var(--red)}
  #bottom{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:space-between;align-items:flex-end;gap:8px;z-index:10;pointer-events:none}
  #bottom > *{pointer-events:auto}
  #hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);transform:translateX(-50%);background:rgba(35,39,66,.8);color:#fff;padding:6px 12px;border-radius:999px;font-size:13px;z-index:9;white-space:nowrap;pointer-events:none}
  #inspectBtn{background:var(--lemon);font-size:18px;padding:14px 20px}
  #toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:15;pointer-events:none;width:92%}
  .toast{background:rgba(251,243,228,.97);border-radius:14px;padding:8px 12px;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.2);animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

  /* notebook */
  .tabs{display:flex;gap:6px;margin:6px 0 12px}
  .tabs button{flex:1;padding:9px 6px;font-size:15px;background:var(--paper2);box-shadow:none}
  .tabs button.on{background:var(--ink);color:#fff}
  .ev{border:2px dashed #d8c39b;border-radius:14px;padding:10px;margin-bottom:8px;background:rgba(255,255,255,.5)}
  .ev .n{font-family:'Jua';font-size:16px}
  .who{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:14px;background:rgba(255,255,255,.55);margin-bottom:8px}
  .dot{width:34px;height:34px;border-radius:50%;flex:none;border:3px solid var(--ink)}
  #miniView{width:100%;height:190px;border-radius:16px;background:radial-gradient(circle,#fff 0%,#f1e3c6 75%);display:block;margin:6px 0 10px}
  .voteBtn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;margin-bottom:8px}
  .voteBtn.on{outline:4px solid var(--red)}
  .bar{height:10px;border-radius:6px;background:var(--red)}
  .lobbyList{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
</style>

<body>
<canvas id="world"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="stack" style="gap:6px">
    <div class="pill" id="phasePill">대기실</div>
    <div class="pill" id="roomPill" style="font-size:13px">방 코드 ----</div>
  </div>
  <div class="stack" style="gap:6px;align-items:flex-end">
    <button id="hostBtn" class="primary hidden">게임 시작</button>
  </div>
</div>
<div id="toasts"></div>
<div id="hint" class="hidden">바닥을 터치해서 이동 · 반짝이는 물건을 터치해서 조사</div>
<div id="bottom" class="hidden">
  <button id="noteBtn" class="navy">📒 수첩</button>
  <button id="inspectBtn" class="hidden">🔍 조사하기</button>
  <button id="voteOpenBtn" class="primary hidden">🗳️ 투표</button>
</div>

<!-- Start screen -->
<div id="startScreen" class="overlay" style="background:rgba(25,22,40,.35)">
  <div class="card dossier">
    <div class="stamp">CASE #1121</div>
    <p class="sub jua" style="margin:0">친구들과 각자 폰으로 접속하는 추리 게임</p>
    <h1 class="title">말랑 산장<br/>살인사건</h1>
    <p class="sub">폭설로 고립된 밤, 산장 주인이 서재에서 쓰러졌다. 범인은 우리 중 한 명.</p>
    <div class="stack">
      <input id="nameInput" maxlength="8" placeholder="닉네임 (8자까지)" />
      <button id="createBtn" class="primary">방 만들기</button>
      <div class="row">
        <input id="codeInput" maxlength="4" placeholder="방 코드" style="text-transform:uppercase" />
        <button id="joinBtn" class="navy" style="flex:none">참가</button>
      </div>
      <div class="err" id="startErr"></div>
      <p class="sub" style="margin:0">💡 대화는 보이스톡이나 디스코드로 하면서 플레이하세요. 추천 인원 4명 (1~6명 가능)</p>
    </div>
  </div>
</div>

<!-- Generic modal -->
<div id="modal" class="overlay hidden">
  <div class="card dossier" id="modalCard"></div>
</div>

<script type="module">

const WALL_H = 1.9, WALL_T = .35, WALL_C = 0xfbe9d7;
function wallSeg(x1,z1,x2,z2){
  const horiz = z1===z2;
  const len = horiz ? Math.abs(x2-x1) : Math.abs(z2-z1);
  const w = rbox(horiz?len+WALL_T:WALL_T, WALL_H, horiz?WALL_T:len+WALL_T, WALL_C, .1);
  at(w,(x1+x2)/2, WALL_H/2, (z1+z2)/2); scene.add(w);
  const h = WALL_T/2;
  addCol(Math.min(x1,x2)-h, Math.max(x1,x2)+h, Math.min(z1,z2)-h, Math.max(z1,z2)+h);
}

function labelSprite(text){
  const c=document.createElement('canvas'); c.width=256; c.height=72; const g=c.getContext('2d');
  g.font='36px Jua, sans-serif'; const w=Math.min(250, g.measureText(text).width+28);
  g.fillStyle='rgba(251,243,228,.95)'; g.beginPath(); g.roundRect((256-w)/2,10,w,52,26); g.fill();
  g.fillStyle='#3b2f2a'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,128,37);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));
  s.scale.set(1.8,.5,1); s.renderOrder=5; return s;
}
function makeChar(color, acc){
  const g = new THREE.Group(); const body = new THREE.Group(); g.add(body);
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(.34,.35,6,16), clay(color)); torso.castShadow=true; at(torso,0,.58,0); body.add(torso);
  body.add(at(sph(.42,color),0,1.32,0));
  for(const s of [-1,1]){ body.add(at(sph(.055,0x2b2222),s*.15,1.36,.37)); const ck=sph(.07,0xff9aa8); at(ck,s*.25,1.24,.33); ck.scale.z=.4; body.add(ck);
    const ft=sph(.13,0x5a4a44); at(ft,s*.16,.1,.05); ft.scale.set(1,.6,1.3); body.add(ft);
    const arm=sph(.11,color); at(arm,s*.4,.62,0); body.add(arm); }
  if(acc==='chef'){ body.add(at(cyl(.24,.22,.35,0xffffff),0,1.82,0)); body.add(at(sph(.3,0xffffff),0,2.02,0)); }
  if(acc==='glasses'){ for(const s of [-1,1]){ const r=new THREE.Mesh(new THREE.TorusGeometry(.09,.02,6,16),clay(0x2d3557)); at(r,s*.15,1.36,.4); body.add(r);} body.add(at(rbox(.6,.4,.5,0x2d3557,.15),0,.62,0)); }
  if(acc==='beret'){ const b=sph(.36,0xc8423a); b.scale.set(1.1,.35,1.1); at(b,.05,1.7,0); b.rotation.z=.25; body.add(b); }
  if(acc==='bow'){ for(const s of [-1,1]){ const b=new THREE.Mesh(new THREE.ConeGeometry(.12,.22,10),clay(0xff6b8a)); b.rotation.z=s*Math.PI/2; at(b,s*.13+.22,1.7,0); body.add(b);} body.add(at(rbox(.62,.42,.5,0x2d3557,.15),0,.6,0)); }
  if(acc==='hat'){ body.add(at(cyl(.45,.45,.04,0x6b5b4b),0,1.66,0)); body.add(at(cyl(.27,.29,.3,0x6b5b4b),0,1.82,0)); }
  return {group:g, body};
}
const avatars = {}; // id -> {group, body, label, key, tx, tz, try, walkT}
function lookFor(p, idx){
  if(p.role){ const r = SCENARIO.roles[p.role] || SCENARIO.helper; return {color:r.color, acc:r.acc, key:p.role}; }
  return {color: LOBBY_COLORS[idx % LOBBY_COLORS.length], acc:null, key:'c'+idx};
}
function syncAvatars(){
  S.order.forEach((id,idx)=>{
    const p = S.players[id]; if(!p) return;
    const look = lookFor(p, idx);
    const labelText = p.role ? `${p.name} · ${(SCENARIO.roles[p.role]||SCENARIO.helper).name}` : p.name;
    let a = avatars[id];
    if(!a || a.key!==look.key || a.labelText!==labelText){
      if(a) scene.remove(a.group);
      const c = makeChar(look.color, look.acc);
      const label = labelSprite(labelText); label.position.y = 2.45; c.group.add(label);
      a = avatars[id] = {...c, label, key:look.key, labelText, tx:p.x, tz:p.z, try:p.ry||0, walkT:0, moving:false};
      c.group.position.set(p.x,0,p.z); scene.add(c.group);
    }
    a.group.visible = p.online !== false;
  });
  for(const id of Object.keys(avatars)) if(!S.players[id]){ scene.remove(avatars[id].group); delete avatars[id]; }
}

const R = .38;
function blocked(x,z){
  if(x<-9.7||x>9.7||z<-9.7||z>18.2) return true;
  for(const c of colliders) if(x>c.minX-R && x<c.maxX+R && z>c.minZ-R && z<c.maxZ+R) return true;
  return false;
}
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0),0);
let downAt = null, pendingInspect = null;
canvas.addEventListener('pointerdown', e=>{ downAt = {x:e.clientX,y:e.clientY,t:performance.now()}; });
canvas.addEventListener('pointerup', e=>{
  if(!downAt || !me.id) return;
  const moved = Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y);
  downAt = null; if(moved>14) return;
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(itemHits,false)[0];
  if(hit && canInvestigate()){
    const id = hit.object.userData.itemId; const p = items[id].group.position;
    if(Math.hypot(p.x-me.x,p.z-me.z) < 2.0){ openInspect(id); return; }
    pendingInspect = id; goTo(p.x, p.z); return;
  }
  const pt = new THREE.Vector3();
  if(ray.ray.intersectPlane(groundPlane, pt)){ goTo(pt.x, pt.z); pendingInspect = null; showMarker(pt.x, pt.z); }
});

/* simple room graph pathing: walk through door centers */
const DOORS = { 'L-S':[0,-5], 'L-K':[-5,0], 'S-H':[5,0], 'K-H':[0,5], 'K-G':[-5,10], 'H-G':[5,10] };
const roomOf = (x,z)=> z>10 ? 'G' : (z<0 ? (x<0?'L':'S') : (x<0?'K':'H'));
function roomPath(a,b){
  if(a===b) return [];
  const prev = {[a]:null}, q=[a];
  while(q.length){ const r=q.shift(); if(r===b) break;
    for(const k in DOORS){ const [p,n]=k.split('-'); const o = p===r?n:(n===r?p:null); if(o && !(o in prev)){ prev[o]={from:r,door:k}; q.push(o);} } }
  const doors=[]; let cur=b; while(prev[cur]){ doors.unshift(DOORS[prev[cur].door]); cur=prev[cur].from; }
  return doors.map(([x,z])=>({x,z,wp:true}));
}
function goTo(x,z){
  me.path = [...roomPath(roomOf(me.x,me.z), roomOf(x,z)), {x,z}];
  me.target = me.path.shift();
}

function canInvestigate(){ return ['investigate','discuss','vote','reveal'].includes(S.phase); }
function nearestItem(){
  let best=null, bd=1.9;
  for(const id in items){ const p=items[id].group.position; const d=Math.hypot(p.x-me.x,p.z-me.z); if(d<bd){bd=d;best=id;} }
  return best;
}

/* ============================================================
   NETWORK (PeerJS, host-authoritative star)
   ============================================================ */
const PREFIX = 'malangcs-2611-';
function genCode(){ const A='ABCDEFGHJKMNPQRSTUVWXYZ'; let s=''; for(let i=0;i<4;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
function startErr(m){ $('#startErr').textContent = m; $('#createBtn').disabled = $('#joinBtn').disabled = false; }

function createRoom(name, tries=0){
  const code = genCode();
  const peer = new Peer(PREFIX+code, {debug:1});
  peer.on('open', ()=>{
    NET.isHost = true; NET.peer = peer; NET.code = code; me.id = 'host'; me.name = name;
    S.players.host = {name, x:7, z:6, ry:0, role:null, online:true}; S.order.push('host');
    enterGame();
    hostBroadcastState();
  });
  peer.on('connection', conn=>{
    conn.on('data', msg=> hostHandle(msg, conn.peer, conn));
    conn.on('close', ()=> hostDrop(conn.peer));
    conn.on('error', ()=> hostDrop(conn.peer));
  });
  peer.on('error', err=>{
    if(err.type==='unavailable-id' && tries<3){ peer.destroy(); createRoom(name, tries+1); return; }
    if(!me.id) startErr('방을 만들지 못했어요. 인터넷 연결을 확인해 주세요. ('+err.type+')');
    else toast('⚠️ 연결 문제: '+err.type);
  });
  peer.on('disconnected', ()=>{ try{ peer.reconnect(); }catch(e){} });
}
function joinRoom(name, code){
  const peer = new Peer({debug:1});
  NET.peer = peer; NET.code = code;
  const timeout = setTimeout(()=>{ if(!me.id) startErr('방을 찾을 수 없어요. 코드를 확인해 주세요.'); }, 12000);
  peer.on('open', id=>{
    const conn = peer.connect(PREFIX+code, {reliable:true, serialization:'json'});
    NET.hostConn = conn;
    conn.on('open', ()=>{ clearTimeout(timeout); me.id = id; me.name = name; conn.send({t:'hello', name}); enterGame(); });
    conn.on('data', onMsg);
    conn.on('close', ()=>{ toast('🔌 방장과 연결이 끊겼어요.'); showModal(`<h2 class="title">연결이 끊겼어요</h2><p>방장이 나갔거나 인터넷이 끊겼어요.</p><button class="primary" onclick="location.reload()">처음으로</button>`, false); });
  });
  peer.on('error', err=>{
    clearTimeout(timeout);
    if(err.type==='peer-unavailable') startErr('방을 찾을 수 없어요. 코드를 확인해 주세요.');
    else if(!me.id) startErr('연결하지 못했어요. ('+err.type+')');
    else toast('⚠️ 연결 문제: '+err.type);
  });
}
function send(msg){
  if(NET.isHost) hostHandle(msg, 'host');
  else if(NET.hostConn && NET.hostConn.open) NET.hostConn.send(msg);
}
function hostSendAll(msg){
  for(const c of Object.values(NET.conns)) if(c.open) c.send(msg);
  onMsg(msg);
}
function hostBroadcastState(){
  const rem = S.phaseEnd ? S.phaseEnd - Date.now() : 0;
  for(const c of Object.values(NET.conns)) if(c.open) c.send({t:'state', s:S, rem});
  onMsg({t:'state', s:S, rem, local:true});
}
function hostDrop(pid){
  if(!NET.conns[pid]) return;
  delete NET.conns[pid];
  const p = S.players[pid]; if(!p) return;
  if(S.phase==='lobby'){ delete S.players[pid]; S.order = S.order.filter(x=>x!==pid); }
  else p.online = false;
  hostSendAll({t:'toast', m:`👋 ${p.name}님이 나갔어요.`});
  hostBroadcastState();
}
function hostHandle(msg, from, conn){
  const p = S.players[from];
  switch(msg.t){
    case 'hello': {
      if(conn) NET.conns[from] = conn;
      if(S.players[from]){ S.players[from].online = true; }
      else {
        S.players[from] = {name:String(msg.name||'탐정').slice(0,8), x:6+Math.random()*2, z:5+Math.random()*2, ry:0, role:null, online:true};
        S.order.push(from);
        if(S.phase!=='lobby') S.players[from].role = assignLateRole();
      }
      hostSendAll({t:'toast', m:`🙋 ${S.players[from].name}님이 들어왔어요.`});
      hostBroadcastState(); break;
    }
    case 'pos': if(p){ p.x=msg.x; p.z=msg.z; p.ry=msg.ry; p.mv=msg.mv; } break;
    case 'pick': {
      const st = S.items[msg.id];
      if(!p || !st || st.holder || !canInvestigate()) return;
      st.holder = from;
      const def = SCENARIO.items.find(i=>i.id===msg.id);
      hostSendAll({t:'toast', m:`👜 누군가 <b>${def.room}</b>에서 증거를 챙겼다…`});
      hostBroadcastState(); break;
    }
    case 'share': {
      const st = S.items[msg.id];
      if(!p || !st || st.holder!==from || st.shared) return;
      st.shared = true;
      const def = SCENARIO.items.find(i=>i.id===msg.id);
      hostSendAll({t:'toast', m:`📢 ${p.name}님이 「${def.name}」을(를) 공개했어요!`});
      hostBroadcastState(); break;
    }
    case 'vote': {
      if(!p || S.phase!=='vote' || !(msg.target in SCENARIO.roles)) return;
      S.votes[from] = msg.target; hostBroadcastState();
      const voters = S.order.filter(id=>S.players[id]?.online!==false);
      if(voters.every(id=>S.votes[id])) hostSendAll({t:'toast', m:'🗳️ 모두 투표했어요! 방장이 결과를 공개할 수 있어요.'});
      break;
    }
    case 'next': if(from==='host') hostNextPhase(); break;
  }
}
function assignLateRole(){
  const taken = new Set(Object.values(S.players).map(p=>p.role));
  return ROLE_KEYS.find(k=>!taken.has(k)) || 'helper';
}
function hostNextPhase(){
  const nx = NEXT[S.phase]; if(!nx) return;
  if(nx==='intro'){
    const keys = [...ROLE_KEYS].sort(()=>Math.random()-.5);
    S.order.forEach((id,i)=>{ S.players[id].role = keys[i] || 'helper'; });
    // everyone back to the hall
    const tp = {};
    S.order.forEach((id,i)=>{ const p=S.players[id]; p.x = 4.5+(i%3)*1.3; p.z = 5.5+Math.floor(i/3)*1.3; tp[id]=[p.x,p.z]; });
    hostSendAll({t:'teleport', p:tp});
  }
  S.phase = nx;
  S.phaseEnd = PHASES[nx].ms ? Date.now()+PHASES[nx].ms : 0;
  hostBroadcastState();
}

/* ---------- message handling (all clients incl. host) ---------- */
let lastPhase = null;
function onMsg(msg){
  switch(msg.t){
    case 'state': {
      if(!NET.isHost) S = msg.s;
      phaseEndLocal = msg.rem ? Date.now()+msg.rem : 0;
      syncAvatars(); updateHud();
      if(S.phase !== lastPhase){ onPhaseChange(lastPhase, S.phase); lastPhase = S.phase; }
      else refreshOpenPanels();
      break;
    }
    case 'poses': for(const [id,v] of Object.entries(msg.p)){ if(id===me.id) continue; const a=avatars[id]; if(a){ a.tx=v[0]; a.tz=v[1]; a.try=v[2]; a.moving=!!v[3]; } } break;
    case 'toast': toast(msg.m); break;
    case 'teleport': { const v = msg.p[me.id]; if(v){ me.x=v[0]; me.z=v[1]; me.target=null; me.path=[]; } break; }
  }
}
// periodic position sync
setInterval(()=>{
  if(!me.id) return;
  if(NET.isHost){
    const p = S.players.host; if(p){ p.x=me.x; p.z=me.z; p.ry=me.ry; p.mv=me.moving; }
    const out = {}; for(const id of S.order){ const q=S.players[id]; if(q) out[id]=[+q.x.toFixed(2),+q.z.toFixed(2),+(q.ry||0).toFixed(2),q.mv?1:0]; }
    for(const c of Object.values(NET.conns)) if(c.open) c.send({t:'poses', p:out});
    if(S.phaseEnd && Date.now() > S.phaseEnd && (S.phase==='investigate'||S.phase==='discuss')) hostNextPhase();
  } else send({t:'pos', x:+me.x.toFixed(2), z:+me.z.toFixed(2), ry:+me.ry.toFixed(2), mv:me.moving?1:0});
}, 100);

let mini = null;
function startMini(id){
  const cv = $('#miniView'); if(!cv) return;
  const w = cv.clientWidth, h = cv.clientHeight;
  const r = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true});
  r.setPixelRatio(Math.min(devicePixelRatio,2)); r.setSize(w,h,false); r.outputColorSpace = THREE.SRGBColorSpace;
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffffff, 0xb59b7a, 1.6)); const dl=new THREE.DirectionalLight(0xffffff,1.4); dl.position.set(2,3,4); sc.add(dl);
  const obj = buildItemVis(id);
  const box = new THREE.Box3().setFromObject(obj); const ctr = box.getCenter(new THREE.Vector3()); const size = box.getSize(new THREE.Vector3()).length() || 1;
  obj.position.sub(ctr); const holder = new THREE.Group(); holder.add(obj); holder.scale.setScalar(1.7/size); sc.add(holder);
  // exploded teardown: remember base positions & directions
  const parts = obj.children.map(m=>{ const p0=m.position.clone(); const d=p0.clone().sub(ctr); if(d.lengthSq()<1e-4) d.set(0,1,0); d.normalize(); return {m,p0,d}; });
  const cam = new THREE.PerspectiveCamera(35, w/h, .1, 50); cam.position.set(0,1.2,4.2); cam.lookAt(0,0,0);
  let t0 = performance.now(), raf;
  const loop = ()=>{ const t=(performance.now()-t0)/1000;
    holder.rotation.y = t*.8; holder.rotation.x = Math.sin(t*.6)*.25;
    const ex = Math.max(0, Math.sin(t*1.1))*.18*size;
    for(const p of parts) p.m.position.copy(p.p0).addScaledVector(p.d, ex);
    r.render(sc, cam); raf = requestAnimationFrame(loop); };
  loop();
  mini = {r, stop:()=>{ cancelAnimationFrame(raf); r.dispose(); }};
}
function stopMini(){ if(mini){ mini.stop(); mini=null; } }

    const byRole = {}; S.order.forEach(id=>{ const p=S.players[id]; if(p?.role) byRole[p.role]=p; });
    body = `<p style="white-space:pre-line;font-size:14px">${SCENARIO.intro}</p>` + ROLE_KEYS.map(rk=>{ const r=SCENARIO.roles[rk]; const p=byRole[rk];
      return `<div class="who"><div class="dot" style="background:${r.css}"></div><div><div class="jua" style="font-size:17px">${r.name} <span class="tag">${r.job}</span> ${p?`<span class="tag">🎮 ${p.name}</span>`:(S.phase==='lobby'?'':'<span class="tag">NPC</span>')}</div>
        <div style="font-size:14px">${r.public}</div>${(!p && S.phase!=='lobby')?`<div style="font-size:14px;margin-top:4px">📝 진술: ${r.npc}</div>`:''}</div></div>`; }).join('');
  }
  showModal(`<h2 class="title" style="font-size:24px">📒 수첩</h2>${tabs}${body}`, true, 'note', tab);
  document.querySelectorAll('.tabs button').forEach(b=> b.onclick = ()=> showNote(b.dataset.t));
  document.querySelectorAll('[data-share]').forEach(b=> b.onclick = ()=> send({t:'share', id:b.dataset.share}));
}

/* ---------- vote & reveal ---------- */
$('#voteOpenBtn').onclick = ()=> S.phase==='reveal' ? showReveal() : showVote();
function showVote(){
  const my = S.votes[me.id];
  const voters = S.order.filter(id=>S.players[id]?.online!==false);
  const done = voters.filter(id=>S.votes[id]).length;
  const btns = ROLE_KEYS.map(rk=>{ const r=SCENARIO.roles[rk];
    return `<button class="voteBtn ${my===rk?'on':''}" data-v="${rk}"><span class="dot" style="background:${r.css}"></span><span><b>${r.name}</b> <span class="tag">${r.job}</span></span></button>`; }).join('');
  showModal(`<div class="stamp">VOTE</div><h2 class="title">범인은 누구?</h2><p class="sub">한 명을 골라 주세요. 결과 공개 전까지 바꿀 수 있어요.</p>${btns}
    <p class="sub">투표 완료 ${done} / ${voters.length}명</p>`, true, 'vote');
  document.querySelectorAll('[data-v]').forEach(b=> b.onclick = ()=> send({t:'vote', target:b.dataset.v}));
}
function showReveal(){
  const tally = {}; ROLE_KEYS.forEach(k=>tally[k]=0);
  Object.values(S.votes).forEach(v=>{ if(v in tally) tally[v]++; });
  const max = Math.max(0, ...Object.values(tally));
  const top = ROLE_KEYS.filter(k=>tally[k]===max && max>0);
  const caught = top.length===1 && top[0]===SCENARIO.culprit;
  const total = Object.values(tally).reduce((a,b)=>a+b,0) || 1;
  const k = myRole();
  const iAmCulprit = k===SCENARIO.culprit;
  const verdict = caught ? (iAmCulprit ? '😱 들켰다… 범인 패배!' : '🎉 범인 검거 성공!') : (iAmCulprit ? '😈 완전 범죄 성공!' : '💨 범인이 빠져나갔다…');
  const bars = ROLE_KEYS.map(rk=>{ const r=SCENARIO.roles[rk];
    return `<div style="margin:6px 0"><div class="row" style="justify-content:space-between"><span><b>${r.name}</b> ${rk===SCENARIO.culprit?'<span class="tag" style="background:#c8423a;color:#fff">범인</span>':''}</span><span>${tally[rk]}표</span></div>
      <div class="bar" style="width:${Math.max(3,tally[rk]/total*100)}%;background:${rk===SCENARIO.culprit?'#c8423a':'#8a7b70'}"></div></div>`; }).join('');
  showModal(`<div class="stamp">CASE CLOSED</div><h2 class="title">${verdict}</h2>${bars}<h3>📜 사건의 진상</h3><p style="white-space:pre-line">${SCENARIO.truth}</p>
    <h3>🤫 모두의 비밀</h3>${ROLE_KEYS.map(rk=>`<p style="font-size:14px"><b>${SCENARIO.roles[rk].name}</b>: ${SCENARIO.roles[rk].secret}</p>`).join('')}`, true, 'reveal');
}

/* ---------- start screen ---------- */
try{ $('#nameInput').value = localStorage.getItem('malang-name') || ''; }catch(e){}
const urlCode = new URLSearchParams(location.search).get('room'); if(urlCode) $('#codeInput').value = urlCode.toUpperCase();
function getName(){ const n = $('#nameInput').value.trim(); if(!n){ startErr('닉네임을 입력해 주세요.'); return null; } try{ localStorage.setItem('malang-name', n); }catch(e){} return n; }
$('#createBtn').onclick = ()=>{ const n=getName(); if(!n) return; $('#createBtn').disabled=$('#joinBtn').disabled=true; $('#startErr').textContent='방을 만드는 중…'; createRoom(n); };
$('#joinBtn').onclick = ()=>{ const n=getName(); if(!n) return; const c=$('#codeInput').value.trim().toUpperCase(); if(c.length!==4){ startErr('4자리 방 코드를 입력해 주세요.'); return; }
  $('#createBtn').disabled=$('#joinBtn').disabled=true; $('#startErr').textContent='접속하는 중…'; joinRoom(n,c); };
$('#inspectBtn').onclick = ()=>{ const id = nearestItem(); if(id) openInspect(id); };

/* ============================================================
   LOOP
   ============================================================ */
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(7, 12, 16);
let myAvatarPreview = null;
function tick(){
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  // local movement
  if(me.id && me.target){
    const dx = me.target.x-me.x, dz = me.target.z-me.z, d = Math.hypot(dx,dz);
    if(d < (me.target.wp ? .35 : .08)){ me.target = me.path?.length ? me.path.shift() : null; if(!me.target) me.moving=false; }
    else {
      const sp = 4.2*dt, step = Math.min(sp,d), nx = me.x+dx/d*step, nz = me.z+dz/d*step;
      let ok=false;
      if(!blocked(nx,nz)){ me.x=nx; me.z=nz; ok=true; }
      else if(!blocked(nx,me.z)){ me.x=nx; ok=true; }
      else if(!blocked(me.x,nz)){ me.z=nz; ok=true; }
      if(!ok){ me.target=null; me.path=[]; me.moving=false; } else { me.moving=true; me.ry = Math.atan2(dx,dz); }
    }
    if(pendingInspect){ const p=items[pendingInspect].group.position; if(Math.hypot(p.x-me.x,p.z-me.z)<1.9){ const id=pendingInspect; pendingInspect=null; me.target=null; me.moving=false; openInspect(id);} else if(!me.target) pendingInspect=null; }
  } else me.moving=false;
  // avatars
  for(const [id,a] of Object.entries(avatars)){
    if(id===me.id){ a.tx=me.x; a.tz=me.z; a.try=me.ry; a.moving=me.moving; a.group.position.set(me.x,0,me.z); }
    else { a.group.position.x += (a.tx-a.group.position.x)*Math.min(1,dt*10); a.group.position.z += (a.tz-a.group.position.z)*Math.min(1,dt*10); }
    let dr = a.try - a.group.rotation.y; dr = Math.atan2(Math.sin(dr),Math.cos(dr)); a.group.rotation.y += dr*Math.min(1,dt*12);
    a.walkT += a.moving ? dt*12 : 0;
    a.body.position.y = a.moving ? Math.abs(Math.sin(a.walkT))*.12 : Math.sin(t*2+id.length)*.02;
    a.body.rotation.z = a.moving ? Math.sin(a.walkT)*.08 : 0;
  }
  // items
  for(const id in items){ const s=items[id].spark; s.rotation.y = t*2; s.position.y += (Math.sin(t*3+id.length)*.002); s.children[0].scale.setScalar(1+Math.sin(t*4)*.15); }
  const ni = (me.id && canInvestigate()) ? nearestItem() : null;
  $('#inspectBtn').classList.toggle('hidden', !ni);
  // camera
  const fx = me.id ? me.x : 0, fz = me.id ? me.z : 2;
  const k = camera.aspect < 1 ? 1.5 : 1; // portrait phones: pull camera back
  const want = new THREE.Vector3(fx, 10.5*k, fz+7.5*k);
  if(!me.id){ want.set(Math.sin(t*.12)*14, 14, 6+Math.cos(t*.12)*14); }
  camPos.lerp(want, Math.min(1, dt*3)); camera.position.copy(camPos); camera.lookAt(fx, 0.5, me.id? fz : 2);
  sun.position.set(fx+6, 16, fz+8); sun.target.position.set(fx,0,fz);
  // fx
  fire.scale.setScalar(1+Math.sin(t*9)*.12); fireLight.intensity = 5.5+Math.sin(t*11)*1.2;
  smoke.position.y = 1.2 + (t*.4%1)*1.2; smoke.material.opacity = 1; smoke.scale.setScalar(1+(t*.4%1));
  const sp = snow.geometry.attributes.position;
  for(let i=0;i<SNOW;i++){ let y=sp.array[i*3+1]-dt*1.1; if(y<0) y=12; sp.array[i*3+1]=y; sp.array[i*3]+=Math.sin(t+i)*dt*.15; }
  sp.needsUpdate = true;
  if(markerT>0){ markerT-=dt*1.5; marker.material.opacity=Math.max(0,markerT); marker.scale.setScalar(1+(1-markerT)*.5); if(markerT<=0) marker.visible=false; }
  // timer
  const tm = $('#timer'); if(tm && phaseEndLocal){ const r=Math.max(0,phaseEndLocal-Date.now()); tm.textContent = `${Math.floor(r/60000)}:${String(Math.floor(r/1000)%60).padStart(2,'0')}`; }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
// debug hook for testing
window.__game = { get S(){return S}, me, NET, goTo, items, camera };
</script>
