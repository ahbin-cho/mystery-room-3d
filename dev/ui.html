<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>UI (dev)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#232742}
#bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#5a4636,#232742)}
#dev{position:fixed;left:6px;bottom:6px;z-index:5;font:12px sans-serif;color:#fff;max-width:62%}
#dev summary{cursor:pointer;background:#000a;padding:4px 8px;border-radius:6px;display:inline-block}
#dev .box{background:#000c;padding:6px;border-radius:8px;display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;max-height:50vh;overflow:auto}
#dev button,#dev select{font:12px sans-serif;padding:4px 6px}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="bg"></div>
<details id="dev"><summary>dev</summary><div class="box">
  <button id="next">next phase</button>
  <select id="item"></select>
  <button id="open">openItem</button><button id="near">setNearby</button><button id="nearStair">near stair</button><button id="nearOff">near off</button>
  <button id="other">p2 picks item</button><button id="otherShare">p2 shares it</button>
  <button id="banner">banner</button>
  <button id="recon">reconnecting</button><button id="conn">connected</button>
  <select id="reason"><option>lost</option><option>refused</option><option>replaced</option><option>host-left</option></select><button id="disc">disconnect</button>
  <button id="votes">bots vote</button>
</div></details>
<script type="module">
import { CASE } from '../src/cases/owl-manor.js';
import { createState, applyAction } from '../src/core/rules.js';
import { createUI } from '../src/ui.js';

// Fake host-side net: applies actions with the real reducer, 'host' = me.
let S = createState(CASE);
const ME = 'host';
let ui;
const roomFloor = id => CASE.MAP.rooms.find(r => r.id === id).floor;
function apply(action, from) {
  if (action.t === 'pick') { // dev: stand at the item so the host's reach check passes
    const it = CASE.ITEMS.find(i => i.id === action.id);
    if (it) Object.assign(S.players[from], { floor: roomFloor(it.room), x: it.pos[0], z: it.pos[2] });
  }
  const out = applyAction(S, CASE, action, from, Date.now());
  S = out.S;
  setTimeout(() => { // like the network: a little later
    ui.onState(structuredClone(S));
    for (const ev of out.events) ui.onEvent(ev);
    for (const ev of out.private?.[ME] ?? []) ui.onEvent(ev);
  }, 120);
}
const net = { isHost: true, code: 'ABCD', pid: ME, send: a => apply(a, ME), close() {} };
const me = { floor: 0, x: 14, z: 14 };
ui = createUI({ caseData: CASE, getState: () => S, me, onAction: t => ui.toast(`onAction ${t.kind} ${t.id}`) });
ui.onReveal(id => console.log('revealed', id));
ui.openStart(async name => {
  await new Promise(r => setTimeout(r, 300));
  ui.setNet(net);
  apply({ t: 'join', name }, ME); apply({ t: 'join', name: '민지' }, 'p2'); apply({ t: 'join', name: '준호' }, 'p3');
}, async () => { throw new Error('방을 찾을 수 없어요. 코드를 확인해 주세요.'); });

const sel = document.getElementById('item');
for (const it of CASE.ITEMS) sel.add(new Option(`${it.id} (${it.kind[0]}${it.container ? ', ' + it.container : ''})`, it.id));
const $ = id => document.getElementById(id);
$('next').onclick = () => apply({ t: 'next' }, ME);
$('open').onclick = () => {
  const it = CASE.ITEMS.find(i => i.id === sel.value);
  Object.assign(me, { floor: roomFloor(it.room), x: it.pos[0], z: it.pos[2] });
  ui.openItem(sel.value);
};
$('near').onclick = () => ui.setNearby({ kind: 'item', id: sel.value });
$('nearStair').onclick = () => ui.setNearby({ kind: 'stairs', id: 'main' });
$('nearOff').onclick = () => ui.setNearby(null);
$('other').onclick = () => apply({ t: 'pick', id: sel.value }, 'p2');
$('otherShare').onclick = () => apply({ t: 'share', id: sel.value }, 'p2');
$('banner').onclick = () => ui.showRoomBanner('서재');
$('recon').onclick = () => ui.showConnection('reconnecting', 3);
$('conn').onclick = () => ui.showConnection('connected');
$('disc').onclick = () => ui.showConnection('disconnected', $('reason').value);
$('votes').onclick = () => { apply({ t: 'vote', target: 'sera' }, 'p2'); apply({ t: 'vote', target: 'yujin' }, 'p3'); };

let last = performance.now();
(function loop(now) { ui.update((now - last) / 1000); last = now; requestAnimationFrame(loop); })(last);
window.__ui = { ui, get S() { return S; }, apply, me };
</script>
</body>
</html>
